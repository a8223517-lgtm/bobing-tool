<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中秋博饼 · 好运工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23131a38'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23f0c75e'/%3E%3Ccircle cx='20' cy='24' r='3' fill='%23e0492f'/%3E%3Ccircle cx='44' cy='40' r='3' fill='%23131a38'/%3E%3Ccircle cx='26' cy='42' r='3' fill='%23131a38'/%3E%3Ccircle cx='38' cy='22' r='3' fill='%23131a38'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23131a38'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night-1:#0b1129;
  --night-2:#131f45;
  --night-3:#241741;
  --gold:#f0c75e;
  --gold-deep:#d9a13b;
  --gold-soft:#ffe9a8;
  --red:#e0492f;
  --red-deep:#b8321f;
  --ink:#f6efe0;
  --muted:#a79fc4;
  --card:rgba(255,255,255,.055);
  --card-border:rgba(240,199,94,.22);
  --radius:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:linear-gradient(175deg,var(--night-1) 0%,var(--night-2) 46%,var(--night-3) 100%) fixed;
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:48px;
}
::selection{background:rgba(240,199,94,.35)}

/* ===== 夜空背景 ===== */
.sky{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stars{position:absolute;top:0;left:0;right:0;bottom:0;inset:0}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.55;animation:twinkle 3.4s ease-in-out infinite}
.star.s{width:2px;height:2px;opacity:.35;animation-duration:4.6s}
.star.l{width:4px;height:4px;opacity:.7;animation-duration:2.7s}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.85)}50%{opacity:.85;transform:scale(1.15)}}
.moon{
  position:absolute;top:7vh;right:6vw;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#fff7d6 0%,#ffe9a8 38%,#f0c75e 68%,#dfae4a 100%);
  box-shadow:0 0 60px 18px rgba(240,199,94,.32),0 0 140px 50px rgba(240,199,94,.12);
  opacity:.92;
}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(190,145,55,.28)}
.moon::before{width:34px;height:34px;top:38px;left:52px}
.moon::after{width:20px;height:20px;top:86px;left:96px}
.cloud{position:absolute;height:26px;border-radius:999px;background:linear-gradient(90deg,rgba(19,31,69,.9),rgba(36,23,65,.9));filter:blur(2px);opacity:.55;animation:drift linear infinite}
.cloud.c1{width:340px;top:12%;left:-360px;animation-duration:95s}
.cloud.c2{width:260px;top:30%;left:-280px;animation-duration:130s;opacity:.35}
.cloud.c3{width:400px;bottom:8%;left:-420px;animation-duration:160s;opacity:.3}
@keyframes drift{to{transform:translateX(140vw)}}
.lantern{position:absolute;top:0;width:46px;opacity:.95;animation:sway 5s ease-in-out infinite;transform-origin:top center}
.lantern.l1{left:4vw}
.lantern.l2{right:3vw;animation-delay:1.6s}
.lantern .rope{width:2px;height:22px;background:var(--gold-deep);margin:0 auto}
.lantern .body{
  width:46px;height:60px;margin:0 auto;border-radius:46% 46% 42% 42%;
  background:linear-gradient(90deg,var(--red-deep) 0%,#f06a3c 30%,var(--red) 55%,#c9381f 100%);
  box-shadow:inset 8px 0 14px rgba(0,0,0,.25),inset -8px 0 10px rgba(255,220,160,.18),0 8px 22px rgba(224,73,47,.35);
  position:relative;
}
.lantern .body::before,.lantern .body::after{content:"";position:absolute;left:4px;right:4px;height:4px;background:var(--gold);border-radius:2px}
.lantern .body::before{top:7px}
.lantern .body::after{bottom:7px}
.lantern .tassel{width:2px;height:14px;background:var(--gold);margin:0 auto;border-radius:0 0 2px 2px}
@keyframes sway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}

/* ===== 布局 ===== */
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:36px 18px 0}
header.app-head{text-align:center;margin-bottom:26px}
.app-head .kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-size:13px;letter-spacing:6px;color:var(--gold);opacity:.9;margin-bottom:10px;
}
.app-head .kicker::before,.app-head .kicker::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));}
.app-head .kicker::after{background:linear-gradient(90deg,var(--gold),transparent)}
.app-head h1{
  font-family:"Noto Serif SC","Songti SC",serif;font-weight:900;font-size:44px;letter-spacing:10px;text-indent:10px;
  background:linear-gradient(180deg,var(--gold-soft) 0%,var(--gold) 55%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px rgba(240,199,94,.28));
}
.app-head .sub{margin-top:8px;font-size:14px;color:var(--muted);letter-spacing:3px}

.card{
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 18px 44px rgba(3,6,20,.35);
  margin-bottom:20px;padding:22px 22px 24px;
  position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;top:0;left:22px;right:22px;height:1px;background:linear-gradient(90deg,transparent,rgba(240,199,94,.55),transparent)}
.card h2{
  font-family:"Noto Serif SC","Songti SC",serif;font-size:19px;font-weight:700;letter-spacing:2px;
  color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:16px;
}
.card h2 .ln{width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--gold),var(--red));flex:none}
.card h2 .ver{
  font-style:normal;font-size:10px;font-family:inherit;letter-spacing:1px;color:var(--gold-soft);
  border:1px solid rgba(240,199,94,.4);border-radius:999px;padding:2px 8px;margin-left:auto;
  background:rgba(240,199,94,.08);white-space:nowrap;
}

/* ===== 玩家 ===== */
.player-row{display:flex;gap:10px;align-items:center}
.player-row label{font-size:13px;color:var(--muted);letter-spacing:1px;white-space:nowrap}
.player-row input{
  flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;
  padding:10px 14px;color:var(--ink);font-size:15px;outline:none;transition:border-color .2s;
  font-family:inherit;
}
.player-row input::placeholder{color:#6b6490}
.player-row input:focus{border-color:var(--gold)}

/* ===== 骰子碗 ===== */
.bowl-wrap{display:flex;flex-direction:column;align-items:center}
.bowl{
  position:relative;width:min(100%,640px);min-height:260px;min-height:clamp(230px,48vw,370px);border-radius:50% 50% 46% 46%;
  background:
    radial-gradient(ellipse at 50% 118%, rgba(0,0,0,.55) 0%, transparent 55%),
    linear-gradient(180deg,#2a2f55 0%,#1c2142 70%,#151a38 100%);
  border:1px solid rgba(240,199,94,.3);
  box-shadow:inset 0 14px 34px rgba(0,0,0,.45),inset 0 -6px 18px rgba(240,199,94,.06),0 10px 26px rgba(0,0,0,.3);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  padding:20px 30px;padding:clamp(16px,4vw,30px) clamp(18px,5vw,40px) clamp(20px,5vw,40px);
  margin:6px auto 20px;
}
.bowl .die{margin:0}
.bowl .rim{
  position:absolute;top:-8px;left:-2px;right:-2px;height:16px;border-radius:50% 50% 0 0;
  background:linear-gradient(180deg,rgba(240,199,94,.5),rgba(240,199,94,.06));
  filter:blur(1px);pointer-events:none;
}

.die{
  width:64px;width:clamp(62px,13vw,74px);height:64px;height:clamp(62px,13vw,74px);border-radius:16px;position:absolute;
  left:10px;top:10px;
  background:linear-gradient(145deg,#fffdf6 0%,#f4ede0 78%,#e6ddca 100%);
  box-shadow:inset 0 -6px 10px rgba(120,90,40,.16),inset 0 4px 6px rgba(255,255,255,.9),0 10px 18px rgba(0,0,0,.4);
  display:grid;grid-template-areas:"a b c" "d e f" "g h i";
  grid-template-rows:repeat(3,1fr);grid-template-columns:repeat(3,1fr);
  padding:9px;gap:2px;
  transition:left .5s cubic-bezier(.25,.9,.35,1.1),top .5s cubic-bezier(.25,.9,.35,1.1);
  transform:rotate(var(--rot,0deg));
  user-select:none;
}
.die .pip{
  width:64%;height:64%;border-radius:50%;place-self:center;background:#23201c;
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.5),inset 0 2px 2px rgba(255,255,255,.35);
  opacity:0;
}
.die .pip.red{background:#d63a24;box-shadow:inset 0 -2px 3px rgba(120,20,10,.6),inset 0 2px 2px rgba(255,180,160,.4)}
.die[data-v="1"] .p5{opacity:1}
.die[data-v="2"] .p1{opacity:1}
.die[data-v="2"] .p9{opacity:1}
.die[data-v="3"] .p1{opacity:1}
.die[data-v="3"] .p5{opacity:1}
.die[data-v="3"] .p9{opacity:1}
.die[data-v="4"] .p1{opacity:1}
.die[data-v="4"] .p3{opacity:1}
.die[data-v="4"] .p7{opacity:1}
.die[data-v="4"] .p9{opacity:1}
.die[data-v="5"] .p1{opacity:1}
.die[data-v="5"] .p3{opacity:1}
.die[data-v="5"] .p5{opacity:1}
.die[data-v="5"] .p7{opacity:1}
.die[data-v="5"] .p9{opacity:1}
.die[data-v="6"] .p1{opacity:1}
.die[data-v="6"] .p3{opacity:1}
.die[data-v="6"] .p4{opacity:1}
.die[data-v="6"] .p6{opacity:1}
.die[data-v="6"] .p7{opacity:1}
.die[data-v="6"] .p9{opacity:1}
.die .p1{grid-area:a}.die .p2{grid-area:b}.die .p3{grid-area:c}
.die .p4{grid-area:d}.die .p5{grid-area:e}.die .p6{grid-area:f}
.die .p7{grid-area:g}.die .p8{grid-area:h}.die .p9{grid-area:i}
.die.rolling{animation:dieRoll .18s linear infinite}
@keyframes dieRoll{
  0%{transform:translateY(0) rotate(var(--r0,0deg)) scale(1)}
  30%{transform:translateY(-12px) rotate(calc(var(--r0,0deg) + 20deg)) scale(1.05)}
  60%{transform:translateY(-6px) rotate(calc(var(--r0,0deg) - 18deg)) scale(.97)}
  100%{transform:translateY(0) rotate(var(--r0,0deg)) scale(1)}
}
.die.land{animation:dieLand .5s cubic-bezier(.22,1.2,.36,1)}
@keyframes dieLand{
  0%{transform:translateY(-26px) scale(1.14) rotate(var(--r0,0deg))}
  100%{transform:translateY(0) scale(1) rotate(var(--rot,0deg))}
}

/* ===== 结果横幅 ===== */
.result-banner{
  width:100%;min-height:112px;border-radius:18px;padding:14px 18px;text-align:center;
  background:rgba(11,17,41,.5);border:1px solid rgba(240,199,94,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:border-color .4s,box-shadow .4s;
  margin-bottom:18px;position:relative;overflow:hidden;
}
.result-banner.hit{animation:bannerGlow 1s ease-out}
@keyframes bannerGlow{
  0%{box-shadow:0 0 0 0 rgba(240,199,94,.45)}
  100%{box-shadow:0 0 0 26px rgba(240,199,94,0)}
}
.result-banner .plabel{font-size:12px;letter-spacing:4px;color:var(--muted)}
.result-banner .pname{
  font-family:"Noto Serif SC","Songti SC",serif;font-weight:900;font-size:34px;line-height:1.15;
  background:linear-gradient(180deg,#f8ead0,#e4bc68);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 8px rgba(240,199,94,.3));
}
.result-banner .pname.big-red{
  background:linear-gradient(180deg,#ffd9c8,#ff7a4d 55%,#e0492f);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(224,73,47,.4));
}
.result-banner .pdesc{font-size:13px;color:var(--muted);letter-spacing:1px}
.result-banner .pdice{font-size:13px;color:var(--gold);letter-spacing:3px;font-family:"Noto Serif SC",serif}

.roll-btn{
  width:100%;max-width:300px;padding:15px 0;border:none;border-radius:16px;cursor:pointer;
  font-family:"Noto Serif SC","Songti SC",serif;font-size:20px;font-weight:700;letter-spacing:8px;text-indent:8px;
  color:#fff6e0;
  background:linear-gradient(180deg,#f06a3c 0%,var(--red) 48%,var(--red-deep) 100%);
  box-shadow:0 10px 26px rgba(224,73,47,.38),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .15s,box-shadow .15s;
}
.roll-btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(224,73,47,.48)}
.roll-btn:active{transform:translateY(1px) scale(.98)}
.roll-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* ===== 规则 ===== */
.rule-list{display:flex;flex-direction:column}
.rule-row{
  display:grid;grid-template-columns:84px 1fr 116px;gap:8px;align-items:center;
  padding:8px 4px;border-bottom:1px dashed rgba(255,255,255,.08);
}
.rule-row:last-child{border-bottom:none}
.rule-row .rname{
  font-family:"Noto Serif SC",serif;font-weight:700;font-size:13px;letter-spacing:.5px;
  padding:4px 6px;border-radius:8px;text-align:center;
  background:rgba(255,255,255,.06);color:var(--ink);
}
.rule-row .rname.top{background:linear-gradient(135deg,rgba(240,199,94,.22),rgba(224,73,47,.2));color:var(--gold-soft);border:1px solid rgba(240,199,94,.35)}
.rule-row .rcond{font-size:12px;color:var(--muted);line-height:1.5}
.rule-row .rcond b{color:var(--gold);font-weight:500}
.rule-row .rcond .rrank{
  font-style:normal;display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:999px;
  background:rgba(255,255,255,.07);color:var(--muted);border:1px solid rgba(255,255,255,.12);
  margin-right:6px;letter-spacing:1px;vertical-align:1px;
}
.rule-row .rcond .rrank.top{background:linear-gradient(135deg,rgba(224,73,47,.28),rgba(240,199,94,.2));color:#ffb49c;border-color:rgba(224,73,47,.5)}
.rule-row .rprize{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  border:1px dashed rgba(255,255,255,.16);border-radius:8px;padding:5px 4px 4px;
  background:rgba(255,255,255,.035);text-align:center;
}
.rule-row .pbox{
  width:44px;height:44px;flex:none;border-radius:9px;overflow:hidden;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 5px,rgba(255,255,255,.02) 5px 10px);
  display:flex;align-items:center;justify-content:center;color:rgba(240,199,94,.55);
  border:1px solid rgba(240,199,94,.18);
}
.rule-row .pbox img{width:100%;height:100%;object-fit:cover;display:block}
.rule-row .pbox svg{width:16px;height:16px}
.rule-row .pbox.none{color:#5a5478}
.rule-row .ptxt{font-size:9.5px;color:#6b6490;line-height:1.35;letter-spacing:0}
.rule-row .ptxt b{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin-bottom:1px}
.rule-note{margin-top:12px;font-size:12px;color:#6b6490;letter-spacing:.5px;text-align:center}

/* ===== 记录 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:rgba(255,255,255,.05);border-radius:14px;padding:12px 6px;text-align:center;border:1px solid rgba(255,255,255,.07)}
.stat .sv{font-family:"Noto Serif SC",serif;font-weight:900;font-size:24px;color:var(--gold)}
.stat .sl{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:3px}
.rec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.rec-head h2{margin-bottom:0}
.rec-head .tools{display:flex;gap:8px}
.mini-btn{
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--muted);
  border-radius:10px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit;letter-spacing:1px;
  transition:background .2s,color .2s;
}
.mini-btn:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.mini-btn.danger:hover{border-color:rgba(224,73,47,.6);color:#ff9a80}
.rec-list{list-style:none;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.rec-list::-webkit-scrollbar{width:5px}
.rec-list::-webkit-scrollbar-thumb{background:rgba(240,199,94,.3);border-radius:3px}
.rec-item{
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  background:rgba(255,255,255,.045);border-radius:13px;padding:10px 13px;
  border:1px solid rgba(255,255,255,.06);
}
.rec-item .rtime{font-size:11px;color:#6b6490;white-space:nowrap;font-variant-numeric:tabular-nums}
.rec-item .rmain{min-width:0}
.rec-item .rplayer{font-size:13px;font-weight:500}
.rec-item .rplayer .tag{font-size:11px;color:var(--muted);font-weight:400}
.rec-item .rdice{font-size:12px;color:var(--gold);letter-spacing:2px;margin-top:2px;font-variant-numeric:tabular-nums}
.rec-item .rprize{
  font-family:"Noto Serif SC",serif;font-size:14px;font-weight:700;padding:5px 11px;border-radius:999px;
  background:rgba(240,199,94,.14);color:var(--gold);border:1px solid rgba(240,199,94,.3);white-space:nowrap;
}
.rec-item .rprize.top{background:linear-gradient(135deg,rgba(224,73,47,.25),rgba(240,199,94,.18));color:#ffb49c;border-color:rgba(224,73,47,.5)}
.rec-empty{text-align:center;padding:26px 0;color:#6b6490;font-size:13px;letter-spacing:1px}

/* ===== 分享 ===== */
.share-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.share-btn{
  border:none;border-radius:14px;padding:15px 8px;cursor:pointer;font-family:"Noto Serif SC",serif;
  font-size:15px;font-weight:700;letter-spacing:3px;text-indent:3px;
  transition:transform .15s,filter .2s;
}
.share-btn:hover{transform:translateY(-2px)}
.share-btn:active{transform:translateY(1px) scale(.98)}
.share-btn.img{background:linear-gradient(180deg,#f0c75e,#d9a13b);color:#3a2a05;box-shadow:0 8px 20px rgba(240,199,94,.3)}
.share-btn.text{background:rgba(255,255,255,.09);color:var(--gold);border:1px solid rgba(240,199,94,.35)}
.share-hint{margin-top:12px;font-size:12px;color:#6b6490;text-align:center;letter-spacing:.5px;line-height:1.7}

/* ===== 弹窗 ===== */
.modal{
  position:fixed;top:0;left:0;right:0;bottom:0;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(5,8,22,.78);backdrop-filter:blur(6px);padding:20px;
}
.modal.open{display:flex}
.modal-box{
  background:linear-gradient(175deg,#141b3a,#1d1440);border:1px solid rgba(240,199,94,.3);border-radius:20px;
  padding:22px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;text-align:center;
  box-shadow:0 30px 70px rgba(0,0,0,.5);
}
.modal-box h3{font-family:"Noto Serif SC",serif;font-size:18px;color:var(--gold);letter-spacing:2px;margin-bottom:14px}
.modal-box img{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .share-btn{flex:1;padding:12px 6px;font-size:14px}
.modal-close{
  margin-top:12px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;
  letter-spacing:2px;font-family:inherit;padding:6px 16px;
}
.modal-close:hover{color:var(--ink)}
.pw-state{margin-top:14px;font-size:12px;color:#6b6490;letter-spacing:.5px;text-align:center;line-height:1.7}
.pw-state .used{color:#ffb49c}
.pw-tip{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:14px}
.pw-input{
  width:100%;box-sizing:border-box;text-align:center;font-size:26px;letter-spacing:12px;text-indent:12px;
  padding:13px 0;border-radius:12px;border:1px solid rgba(240,199,94,.4);background:rgba(255,255,255,.07);
  color:var(--gold-soft);font-family:inherit;outline:none;
}
.pw-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,199,94,.15)}
.pw-err{color:#ff9a80;font-size:12px;min-height:18px;margin-top:10px;letter-spacing:1px}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);z-index:60;
  background:rgba(20,27,58,.95);border:1px solid rgba(240,199,94,.4);color:var(--gold-soft);
  padding:11px 22px;border-radius:12px;font-size:13px;letter-spacing:1px;opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;box-shadow:0 12px 30px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 响应式 ===== */
@media (max-width:520px){
  .app{padding:24px 12px 0}
  .app-head h1{font-size:36px;letter-spacing:8px;text-indent:8px}
  .moon{width:110px;height:110px;top:5vh;right:4vw}
  .card{padding:18px 16px 20px}
  .rule-row{grid-template-columns:76px 1fr 104px;gap:6px;padding:7px 2px}
  .rule-row .rname{font-size:12px;letter-spacing:0;padding:3px 4px}
  .rule-row .rcond{font-size:11px}
  .rule-row .rprize{padding:4px 2px 3px}
  .stat-grid{grid-template-columns:repeat(4,1fr);gap:7px}
  .stat .sv{font-size:20px}
  .result-banner .pname{font-size:29px}
  .share-btns{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .die.rolling,.lantern,.cloud,.star{animation:none}
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="lantern l1"><div class="rope"></div><div class="body"></div><div class="tassel"></div></div>
  <div class="lantern l2"><div class="rope"></div><div class="body"></div><div class="tassel"></div></div>
</div>

<main class="app">
  <header class="app-head">
    <div class="kicker">闽南传统 · 中秋佳节</div>
    <h1>中秋博饼</h1>
    <p class="sub">骰子一响 · 好运登场</p>
  </header>

  <!-- ===== 玩家 ===== -->
  <section class="card">
    <h2><span class="ln"></span>玩家</h2>
    <div class="player-row">
      <label for="playerName">昵称</label>
      <input id="playerName" type="text" maxlength="12" placeholder="输入你的昵称（默认：游客）">
    </div>
  </section>

  <!-- ===== 博饼 ===== -->
  <section class="card">
    <h2><span class="ln"></span>开博</h2>
    <div class="bowl-wrap">
      <div class="bowl" id="bowl">
        <div class="rim"></div>
      </div>
      <div class="result-banner" id="resultBanner">
        <span class="plabel">本局结果</span>
        <span class="pname" id="prizeName">点击掷骰开博</span>
        <span class="pdesc" id="prizeDesc"></span>
        <span class="pdice" id="prizeDice"></span>
      </div>
      <button class="roll-btn" id="rollBtn">掷 骰</button>
      <p class="pw-state" id="pwState">首掷免费 · 之后每次掷骰需输入口令</p>
    </div>
  </section>

  <!-- ===== 规则 ===== -->
  <section class="card">
    <h2><span class="ln"></span>奖项规则<em class="ver">V2.0</em></h2>
    <div class="rule-list" id="ruleList"></div>
  </section>

  <!-- ===== 记录 ===== -->
  <section class="card">
    <div class="rec-head">
      <h2><span class="ln"></span>博饼记录</h2>
      <div class="tools">
        <button class="mini-btn" id="clearBtn" type="button">清空记录</button>
      </div>
    </div>
    <div class="stat-grid" id="statGrid"></div>
    <ul class="rec-list" id="recList"></ul>
    <p class="rec-empty" id="recEmpty">还没有记录，掷一骰试试手气</p>
  </section>

  <!-- ===== 分享 ===== -->
  <section class="card">
    <h2><span class="ln"></span>分享好运</h2>
    <div class="share-btns">
      <button class="share-btn img" id="shareImgBtn" type="button">生成分享卡片</button>
      <button class="share-btn text" id="shareTextBtn" type="button">复制分享文案</button>
    </div>
    <p class="share-hint">卡片可保存为图片转发到微信 / 小红书 / 朋友圈<br>未掷骰时分享的是页面邀请文案</p>
  </section>
</main>

<!-- ===== 分享预览弹窗 ===== -->
<div class="modal" id="shareModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h3 id="modalTitle">分享卡片</h3>
    <img id="modalImg" alt="博饼分享卡片">
    <div class="modal-actions">
      <button class="share-btn img" id="downloadBtn" type="button">保存图片</button>
      <button class="share-btn text" id="nativeShareBtn" type="button">系统分享</button>
    </div>
    <button class="modal-close" id="modalClose" type="button">关 闭</button>
  </div>
</div>

<!-- ===== 口令弹窗 ===== -->
<div class="modal" id="pwModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h3>输入口令</h3>
    <p class="pw-tip">免费掷骰已用完，输入一个中秋好运口令继续<br>每个口令仅限使用一次</p>
    <input class="pw-input" id="pwInput" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="中秋好运口令">
    <p class="pw-err" id="pwErr"></p>
    <div class="modal-actions">
      <button class="share-btn img" id="pwOkBtn" type="button">确认掷骰</button>
    </div>
    <button class="modal-close" id="pwCancelBtn" type="button">取 消</button>
  </div>
</div>

<div class="toast" id="toast"></div>

  dice.forEach(d=>cnt[d-1]++);

  if(four===4 && cnt.some(c=>c===2)) return 0; // 状元插金花：4 个「四」+ 一对
  if(four>=4 || max>=5) return 1;              // 状元：4 个「四」或 5 个以上相同骰子
  if(cnt.every(c=>c===1)) return 2;            // 对堂：1-6 各一个
  if(four===3) return 3;                       // 三红：3 个「四」
  if(max===4) return 4;                        // 四进：4 个相同骰子（4 个「四」已归状元/插金花）
  if(four===2) return 5;                       // 二举：2 个「四」
  if(four===1) return 6;                       // 一秀：1 个「四」
  return 7;                                    // 未中奖
}

/* ===== 骰子 ===== */
function buildDie(){
  const d=document.createElement('div');
  d.className='die';
  for(let i=1;i<=9;i++){
    const p=document.createElement('div');
    p.className='pip p'+i;
    d.appendChild(p);
  }
  return d;
}
function renderDie(die,v){
  die.dataset.v=v;
  die.querySelectorAll('.pip').forEach(p=>p.classList.toggle('red',v===1||v===4));
}
function scatterDie(die, placed){
  const bbox=bowl.getBoundingClientRect();
  const d=die.offsetWidth;
  const rx=(bbox.width-d)/2-8, ry=(bbox.height-d)/2-8;
  const cx=(bbox.width-d)/2, cy=(bbox.height-d)/2;
  let x=cx, y=cy, ok=false, best=null, bestGap=-1;
  for(let i=0;i<200;i++){
    const px=Math.random()*2-1, py=Math.random()*2-1;
    if(px*px+py*py>1) continue;
    x=cx+px*rx; y=cy+py*ry;
    if(!placed||!placed.length){ ok=true; break; }
    let minGap=1e9;
    placed.forEach(p=>{
      const dx=(x+d/2)-p.x, dy=(y+d/2)-p.y;
      const g=Math.sqrt(dx*dx+dy*dy);
      if(g<minGap) minGap=g;
    });
    if(minGap>=d){ ok=true; break; }
    if(minGap>bestGap){ bestGap=minGap; best={x:x,y:y}; }
  }
  if(!ok&&best){ x=best.x; y=best.y; }
  die.style.left=x.toFixed(1)+'px';
  die.style.top=y.toFixed(1)+'px';
  die.style.setProperty('--rot',(Math.random()*46-23).toFixed(1)+'deg');
  return {x:x+d/2, y:y+d/2};
}
function initDice(){
  const placed=[];
  for(let i=0;i<6;i++){
    const d=buildDie();
    renderDie(d,1+Math.floor(Math.random()*6));
    bowl.appendChild(d);
    placed.push(scatterDie(d,placed));
  }
}

/* ===== 掷骰 ===== */
function roll(){
  if(rolling) return;
  rolling=true;
  rollBtn.disabled=true;
  resultBanner.classList.remove('hit');
  const target=[...Array(6)].map(()=>1+Math.floor(Math.random()*6));
  const dice=[...bowl.querySelectorAll('.die')];
  dice.forEach((d,i)=>{
    d.classList.remove('land');
    d.classList.add('rolling');
    d.style.setProperty('--r0',(Math.random()*60-30).toFixed(1)+'deg');
  });
  prizeName.textContent='博得正欢…';
  prizeDesc.textContent='';
  prizeDice.textContent='';
  let t=0;
  const iv=setInterval(()=>{
    t+=70;
    dice.forEach(d=>renderDie(d,1+Math.floor(Math.random()*6)));
    if(t>=1150){
      clearInterval(iv);
      const placed=[];
      dice.forEach((d,i)=>{
        d.classList.remove('rolling');
        d.classList.add('land');
        renderDie(d,target[i]);
        placed.push(scatterDie(d,placed));
        setTimeout(()=>d.classList.remove('land'),540);
      });
      finishRoll(target);
    }
  },70);
}
function finishRoll(dice){
  const pi=judgeDice(dice);
  const p=PRIZES[pi];
  const player=getPlayer();
  lastRec={id:Date.now()+''+Math.floor(Math.random()*1000), time:Date.now(), player:player, dice:[...dice], prize:pi};
  records.unshift(lastRec);
  if(records.length>200) records.pop();
  saveRecords();
  renderRecords();

  prizeName.textContent=p.name;
  prizeName.classList.toggle('big-red',p.level<=2);
  prizeDesc.textContent=p.bless;
  prizeDice.textContent='掷出 '+dice.join(' · ');
  resultBanner.classList.add('hit');
  if(p.level<=2 && navigator.vibrate) navigator.vibrate(60);
  rolling=false;
  rollBtn.disabled=false;
}

function drawQR(ctx,x,y,size,data){
  try{
    const qr=qrcode(0,'M');
    qr.addData(data);
    qr.make();
    const n=qr.getModuleCount();
    const cell=size/n;
    ctx.fillStyle='#ffffff';
    ctx.fillRect(x-3,y-3,size+6,size+6);
    ctx.fillStyle='#191927';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){
      if(qr.isDark(r,c)) ctx.fillRect(x+c*cell,y+r*cell,Math.ceil(cell),Math.ceil(cell));
    }
  }catch(e){}
}
function drawGiftIcon(ctx,x,y,s){
  ctx.fillStyle='#e0492f';
  ctx.beginPath(); ctx.rect(x,y+s*.45,s,s*.55); ctx.fill();            // 盒身
  ctx.fillStyle='#f0c75e';
  ctx.beginPath(); ctx.rect(x,y+s*.3,s,s*.2); ctx.fill();              // 盒盖
  ctx.fillStyle='#fff6e0';
  ctx.fillRect(x+s*.45,y,s*.1,s);                                      // 竖丝带
  ctx.fillStyle='#f0c75e';
  ctx.beginPath(); ctx.arc(x+s/2,y+s*.4,s*.09,0,Math.PI*2); ctx.fill(); // 蝴蝶结
}
function drawBearIcon(ctx,x,y,s){
  ctx.fillStyle='#c98d4e';
  ctx.beginPath(); ctx.arc(x+s*.28,y+s*.28,s*.22,0,Math.PI*2); ctx.fill(); // 左耳
  ctx.beginPath(); ctx.arc(x+s*.72,y+s*.28,s*.22,0,Math.PI*2); ctx.fill(); // 右耳
  ctx.beginPath(); ctx.arc(x+s/2,y+s*.55,s*.34,0,Math.PI*2); ctx.fill();   // 脸
  ctx.fillStyle='#7a4a24';
  ctx.beginPath(); ctx.arc(x+s*.4,y+s*.52,s*.04,0,Math.PI*2); ctx.fill(); // 左眼
  ctx.beginPath(); ctx.arc(x+s*.6,y+s*.52,s*.04,0,Math.PI*2); ctx.fill(); // 右眼
  ctx.beginPath(); ctx.arc(x+s/2,y+s*.62,s*.05,0,Math.PI*2); ctx.fill();  // 鼻子
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawCanvasDie(ctx,x,y,size,v){
  const r=size*0.22;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.4)';
  ctx.shadowBlur=16;
  ctx.shadowOffsetY=7;
  roundRectPath(ctx,x,y,size,size,r);
  const g=ctx.createLinearGradient(x,y,x,y+size);
  g.addColorStop(0,'#fffdf6');
  g.addColorStop(1,'#e6ddca');
  ctx.fillStyle=g;
  ctx.fill();
  ctx.restore();
  roundRectPath(ctx,x,y,size,size,r);
  ctx.strokeStyle='rgba(120,90,40,.2)';
  ctx.lineWidth=2;
  ctx.stroke();
  const pos={
    1:[[.5,.5]],
    2:[[.72,.28],[.28,.72]],
    3:[[.72,.28],[.5,.5],[.28,.72]],
    4:[[.28,.28],[.72,.28],[.28,.72],[.72,.72]],
    5:[[.28,.28],[.72,.28],[.5,.5],[.28,.72],[.72,.72]],
    6:[[.28,.28],[.72,.28],[.28,.5],[.72,.5],[.28,.72],[.72,.72]]
  };
  const pr=size*0.085;
  pos[v].forEach(([px,py])=>{
    ctx.beginPath();
    ctx.arc(x+px*size,y+py*size,pr,0,Math.PI*2);
    ctx.fillStyle=(v===1||v===4)?'#d63a24':'#23201c';
    ctx.fill();
  });
}
function drawCloud(ctx,x,y){
  ctx.save();
  ctx.globalAlpha=.45;
  ctx.fillStyle='#101735';
  ctx.beginPath();
  ctx.ellipse(x,y,120,26,0,0,Math.PI*2);
  ctx.ellipse(x+62,y-14,70,20,0,0,Math.PI*2);
  ctx.ellipse(x-62,y-10,80,22,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function makeShareCard(rec){
  const ctx=shareCanvas.getContext('2d');
  const W=750,H=1334;
  ctx.clearRect(0,0,W,H);
  ctx.textAlign='center';  // 统一所有文字水平居中

  const fontSerif='"Noto Serif SC","Songti SC",serif';
  const fontSans='"Noto Sans SC","PingFang SC",sans-serif';

  // ---- 背景：深蓝夜空 ----
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0b1129');
  bg.addColorStop(.48,'#16224a');
  bg.addColorStop(1,'#2a1b45');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);
  // 星星
  for(let i=0;i<95;i++){
    ctx.globalAlpha=Math.random()*.5+.2;
    ctx.beginPath();
    ctx.arc(Math.random()*W,Math.random()*H,Math.random()*2.2+.7,0,Math.PI*2);
    ctx.fillStyle='#ffffff';
    ctx.fill();
  }
  ctx.globalAlpha=1;
  // 月亮（右上角）
  ctx.save();
  ctx.shadowColor='rgba(240,199,94,.5)';
  ctx.shadowBlur=60;
  ctx.beginPath();
  ctx.arc(658,160,92,0,Math.PI*2);
  const mg=ctx.createRadialGradient(646,148,10,658,160,92);
  mg.addColorStop(0,'#fff7d6');
  mg.addColorStop(.65,'#f0c75e');
  mg.addColorStop(1,'#dfae4a');
  ctx.fillStyle=mg;
  ctx.fill();
  ctx.restore();
  // 云
  ctx.save();
  ctx.globalAlpha=.45;
  ctx.fillStyle='#101735';
  ctx.beginPath(); ctx.ellipse(120,420,120,26,0,0,Math.PI*2);
  ctx.ellipse(182,406,70,20,0,0,Math.PI*2);
  ctx.ellipse(58,410,80,22,0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath(); ctx.ellipse(640,900,120,26,0,0,Math.PI*2);
  ctx.ellipse(702,886,70,20,0,0,Math.PI*2);
  ctx.ellipse(578,890,80,22,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // ---- 标题 ----
  ctx.save();
  ctx.shadowColor='rgba(240,199,94,.35)';
  ctx.shadowBlur=26;
  ctx.shadowOffsetY=6;
  const tg=ctx.createLinearGradient(0,140,0,250);
  tg.addColorStop(0,'#ffe9a8');
  tg.addColorStop(.55,'#f0c75e');
  tg.addColorStop(1,'#d9a13b');
  ctx.fillStyle=tg;
  ctx.font='900 92px '+fontSerif;
  ctx.fillText('中秋博饼',W/2,218);
  ctx.restore();
  // 分隔
  ctx.strokeStyle='rgba(240,199,94,.35)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(W/2-175,280);
  ctx.lineTo(W/2+175,280);
  ctx.stroke();
  ctx.fillStyle='#f0c75e';
  ctx.beginPath();
  ctx.moveTo(W/2,272);
  ctx.lineTo(W/2+11,282);
  ctx.lineTo(W/2,292);
  ctx.lineTo(W/2-11,282);
  ctx.closePath();
  ctx.fill();

  if(rec){
    const p=PRIZES[rec.prize]||PRIZES[7];
    // 奖项大字
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.5)';
    ctx.shadowBlur=22;
    ctx.shadowOffsetY=8;
    const ag=ctx.createLinearGradient(0,330,0,485);
    if(p.level<=2){
      ag.addColorStop(0,'#ffd9c8');
      ag.addColorStop(.5,'#ff8a5c');
      ag.addColorStop(1,'#e0492f');
    }else{
      ag.addColorStop(0,'#fff3d0');
      ag.addColorStop(.55,'#f0c75e');
      ag.addColorStop(1,'#d9a13b');
    }
    ctx.fillStyle=ag;
    ctx.font='900 116px '+fontSerif;
    ctx.fillText(p.name,W/2,428);
    ctx.restore();
    // 祝福语（紧跟结果）
    ctx.fillStyle='rgba(240,199,94,.92)';
    ctx.font='600 40px '+fontSerif;
    ctx.fillText(p.bless,W/2,500);
  }else{
    // 邀请卡：随机展示一个奖项寓意文案（与结果卡同结构）
    const rp=PRIZES[Math.floor(Math.random()*PRIZES.length)];
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.5)';
    ctx.shadowBlur=22;
    ctx.shadowOffsetY=8;
    const ag=ctx.createLinearGradient(0,330,0,480);
    if(rp.level<=2){
      ag.addColorStop(0,'#ffd9c8');
      ag.addColorStop(.5,'#ff8a5c');
      ag.addColorStop(1,'#e0492f');
    }else{
      ag.addColorStop(0,'#fff3d0');
      ag.addColorStop(.55,'#f0c75e');
      ag.addColorStop(1,'#d9a13b');
    }
    ctx.fillStyle=ag;
    ctx.font='900 104px '+fontSerif;
    ctx.fillText(rp.name,W/2,428);
    ctx.restore();
    ctx.fillStyle='rgba(240,199,94,.92)';
    ctx.font='600 40px '+fontSerif;
    ctx.fillText(rp.bless,W/2,500);
  }

  // ---- 骰子展示（骰子上移，无标签） ----
  const ds=82,gap=14;
  const x0=(W-(ds*6+gap*5))/2;
  if(rec){
    rec.dice.forEach((v,i)=>drawCanvasDie(ctx,x0+i*(ds+gap),565,ds,v));
  }else{
    for(let i=0;i<6;i++){
      drawCanvasDie(ctx,x0+i*(ds+gap),565,ds,1+Math.floor(Math.random()*6));
    }
  }

  // ---- 丰厚奖品等你来博 ----
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.4)';
  ctx.shadowBlur=18;
  ctx.shadowOffsetY=6;
  ctx.fillStyle='#f0c75e';
  ctx.font='800 46px '+fontSerif;
  ctx.fillText('丰厚奖品等你来博',W/2,730);
  ctx.restore();
  // 两个奖品卡（放大）
  const pw=310,ph=180,gapw=20,px=(W-(pw*2+gapw))/2,py=758;
  const prizes=[['月饼礼盒',0],['院校小熊',1]];
  prizes.forEach((g,i)=>{
    const x=px+i*(pw+gapw);
    roundRectPath(ctx,x,py,pw,ph,20);
    ctx.fillStyle='rgba(8,10,28,.5)';
    ctx.fill();
    roundRectPath(ctx,x,py,pw,ph,20);
    ctx.strokeStyle='rgba(240,199,94,.4)';
    ctx.lineWidth=2;
    ctx.stroke();
    if(g[1]===0){
      if(mooncakeImg.complete && mooncakeImg.naturalWidth>0){
        ctx.save();
        roundRectPath(ctx,x+pw/2-55,py+18,110,110,16);
        ctx.clip();
        ctx.drawImage(mooncakeImg,x+pw/2-55,py+18,110,110);
        ctx.restore();
        roundRectPath(ctx,x+pw/2-55,py+18,110,110,16);
        ctx.strokeStyle='rgba(240,199,94,.45)';
        ctx.lineWidth=2;
        ctx.stroke();
      }else drawGiftIcon(ctx,x+pw/2-55,py+18,110);
    }else{
      if(bearImg.complete && bearImg.naturalWidth>0){
        ctx.save();
        roundRectPath(ctx,x+pw/2-55,py+18,110,110,16);
        ctx.clip();
        ctx.drawImage(bearImg,x+pw/2-55,py+18,110,110);
        ctx.restore();
        roundRectPath(ctx,x+pw/2-55,py+18,110,110,16);
        ctx.strokeStyle='rgba(240,199,94,.45)';
        ctx.lineWidth=2;
        ctx.stroke();
      }else drawBearIcon(ctx,x+pw/2-55,py+18,110);
    }
    ctx.fillStyle='#f0c75e';
    ctx.font='700 32px '+fontSerif;
    ctx.fillText(g[0],x+pw/2,py+ph-16);
  });

  // ---- 二维码（用户导流码，白底圆角）----
  const qSize=180,qx=(W-qSize)/2,qy=985;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)';
  ctx.shadowBlur=20;
  ctx.shadowOffsetY=6;
  roundRectPath(ctx,qx-8,qy-8,qSize+16,qSize+16,18);
  ctx.fillStyle='#fff';
  ctx.fill();
  ctx.restore();
  if(qrImg.complete && qrImg.naturalWidth>0) ctx.drawImage(qrImg,qx,qy,qSize,qSize);

  // ---- 红色按钮 ----
  const bw=620,bh=78,bx=(W-bw)/2,by=1216;
  ctx.save();
  ctx.shadowColor='rgba(224,73,47,.45)';
  ctx.shadowBlur=24;
  ctx.shadowOffsetY=8;
  roundRectPath(ctx,bx,by,bw,bh,34);
  const rg=ctx.createLinearGradient(0,by,0,by+bh);
  rg.addColorStop(0,'#f06a3c');
  rg.addColorStop(.5,'#e0492f');
  rg.addColorStop(1,'#b8321f');
  ctx.fillStyle=rg;
  ctx.fill();
  ctx.restore();
  ctx.fillStyle='#fff6e0';
  ctx.font='700 36px '+fontSerif;
  ctx.fillText('中秋快乐 扫码来博饼',W/2,by+50);
}

/* ===== 分享交互 ===== */
function openShareModal(){
  const rec=lastRec;
  makeShareCard(rec);
  shareCanvas.toBlob(blob=>{
    if(!blob){ toast('卡片生成失败，请重试'); return; }
    if(lastShareUrl) URL.revokeObjectURL(lastShareUrl);
    lastShareUrl=URL.createObjectURL(blob);
    modalImg.src=lastShareUrl;
    modalTitle.textContent=rec?'博饼结果分享卡':'博饼邀请分享卡';
    shareModal.classList.add('open');
  },'image/png');
}
async function copyShareText(){
  const txt=shareText(lastRec);
  try{
    await navigator.clipboard.writeText(txt);
    toast('分享文案已复制');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=txt;
    ta.style.cssText='position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); toast('分享文案已复制'); }
    catch(_){ toast('复制失败，请手动复制'); }
    ta.remove();
  }
}
function pad2(n){ return String(n).padStart(2,'0'); }

shareImgBtn.addEventListener('click',openShareModal);
shareTextBtn.addEventListener('click',copyShareText);
downloadBtn.addEventListener('click',()=>{
  if(!lastShareUrl){ toast('请先生成分享卡片'); return; }
  const d=new Date();
  const a=document.createElement('a');
  a.href=lastShareUrl;
  a.download='中秋博饼-分享-'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'-'+pad2(d.getHours())+pad2(d.getMinutes())+'.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('卡片已保存到下载');
});
nativeShareBtn.addEventListener('click',async()=>{
  try{
    if(!navigator.share){ toast('当前浏览器不支持系统分享，请用「保存图片」'); return; }
    const blob=await new Promise(res=>shareCanvas.toBlob(res,'image/png'));
    const file=new File([blob],'bobing-share.png',{type:'image/png'});
    const sd={title:'中秋博饼',text:shareText(lastRec)};
    if(navigator.canShare && navigator.canShare({files:[file]})) sd.files=[file];
    await navigator.share(sd);
  }catch(e){
    if(!(e && e.name==='AbortError')) toast('系统分享未完成，可改用保存图片');
  }
});
modalClose.addEventListener('click',()=>shareModal.classList.remove('open'));
shareModal.addEventListener('click',e=>{ if(e.target===shareModal) shareModal.classList.remove('open'); });

/* ===== 初始化 ===== */
initDice();
renderRecords();

/* ===== 口令门禁：首掷免费，之后每次需输入口令 ===== */
const PW_FREE_KEY='bobing_pw_free_v1', PW_USED_KEY='bobing_pw_used_v1';
const INTERNAL_PW='0104';  // 内部测试口令，无限次使用
const pwModal=$('pwModal'), pwInput=$('pwInput'), pwErr=$('pwErr'),
      pwOkBtn=$('pwOkBtn'), pwCancelBtn=$('pwCancelBtn'), pwState=$('pwState');
let freeUsed=false, usedPw=[];
try{ freeUsed=localStorage.getItem(PW_FREE_KEY)==='1'; }catch(e){}
try{ usedPw=JSON.parse(localStorage.getItem(PW_USED_KEY)||'[]')||[]; }catch(e){ usedPw=[]; }
function savePwState(){
  try{
    localStorage.setItem(PW_FREE_KEY,freeUsed?'1':'0');
    localStorage.setItem(PW_USED_KEY,JSON.stringify(usedPw));
  }catch(e){}
}
function refreshPwState(){
  if(!freeUsed){ pwState.innerHTML='首掷免费 · 之后每次掷骰需输入口令'; }
  else{
    const left=PASSWORD_SET.size-usedPw.length;
    pwState.innerHTML='免费掷骰已用完 · 继续掷骰需输入口令<span class="used">（本机已用 '+usedPw.length+' 个口令）</span>';
  }
}
function openPwModal(){
  pwInput.value=''; pwErr.textContent='';
  pwModal.classList.add('open');
  setTimeout(()=>pwInput.focus(),80);
}
function closePwModal(){ pwModal.classList.remove('open'); }
function confirmPw(){
  const pw=pwInput.value.trim();
  if(!/^\d{4}$/.test(pw)){ pwErr.textContent='口令需为 4 位数字'; return; }
  if(pw===INTERNAL_PW){ closePwModal(); roll(); return; }  // 内部口令：不限次数
  if(!PASSWORD_SET.has(pw)){ pwErr.textContent='口令无效，请检查后重试'; pwInput.value=''; return; }
  if(usedPw.indexOf(pw)>=0){ pwErr.textContent='该口令已使用过'; pwInput.value=''; return; }
  usedPw.push(pw); savePwState(); closePwModal(); refreshPwState();
  roll();
}
pwOkBtn.addEventListener('click',confirmPw);
pwCancelBtn.addEventListener('click',closePwModal);
pwModal.addEventListener('click',e=>{ if(e.target===pwModal) closePwModal(); });
pwInput.addEventListener('keydown',e=>{ if(e.key==='Enter') confirmPw(); });
pwInput.addEventListener('input',()=>{ pwErr.textContent=''; });

rollBtn.addEventListener('click',()=>{
  if(rolling) return;
  if(!freeUsed){
    freeUsed=true; savePwState(); refreshPwState();
    roll();
  }else{
    refreshPwState();
    openPwModal();
  }
});
refreshPwState();
</script>
