<style>
  :root{
    --navy:#1F3864; --navy-deep:#16294A; --red:#C8102E; --sand:#EDE4D3;
    --cream:#FAF6EE; --ink:#22303F; --gold:#E8B84B; --muted:#7A8088;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--navy-deep);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  .serif{font-family:"Noto Serif SC",serif}

  /* 全屏校园背景 */
  .bg{position:fixed;inset:0;z-index:-2;background:var(--navy-deep)}
  .bg img{width:100%;height:100%;object-fit:cover;object-position:center 32%}
  .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,24,46,.62) 0%,rgba(14,24,46,.42) 42%,rgba(14,24,46,.90) 100%),radial-gradient(circle at 82% -8%,rgba(232,184,75,.16),transparent 46%),radial-gradient(circle at 12% 108%,rgba(200,16,46,.13),transparent 50%)}

  header{background:linear-gradient(180deg,#23417A,var(--navy-deep));color:#fff;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid rgba(232,184,75,.4)}
  header a{color:#C3CFE6;text-decoration:none;font-size:13px}
  header a:hover{color:#fff}
  header h1{font-size:18px;font-weight:700;letter-spacing:.06em;flex:1}
  .hd{font-size:13px;color:#9FB0CE;letter-spacing:.1em}

  .wrap{max-width:620px;margin:0 auto;padding:20px;width:100%;flex:1}

  /* 开场 */
  .intro{text-align:center;padding:40px 8px 24px}
  .intro .logo{width:76px;margin:0 auto 20px;display:block;background:rgba(255,255,255,.94);border-radius:50%;padding:13px;box-shadow:0 12px 32px rgba(0,0,0,.38)}
  .intro .eyebrow{font-size:12.5px;letter-spacing:.42em;color:#E6C98A;font-weight:500;margin-bottom:14px}
  .intro h2{font-size:clamp(30px,7vw,38px);font-weight:900;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45)}
  .intro .sub{font-family:"Noto Serif SC",serif;color:#E6C98A;font-size:14px;letter-spacing:.22em;margin:12px 0 18px}
  .intro p{font-size:14px;color:#D6DEF0;max-width:400px;margin:0 auto;line-height:2;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  .intro .start{margin-top:26px;background:var(--red);color:#fff;border:none;border-radius:999px;padding:15px 54px;font-size:16px;font-weight:700;font-family:inherit;letter-spacing:.1em;cursor:pointer;box-shadow:0 12px 30px rgba(200,16,46,.3);transition:transform .18s}
  .intro .start:hover{transform:translateY(-2px)}

  /* 题目 */
  .quiz{display:none}
  .dots{display:flex;gap:8px;justify-content:center;margin:18px 0 22px}
  .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.32);transition:all .3s}
  .dots i.on{background:var(--red);transform:scale(1.3)}
  .qcard{background:rgba(255,255,255,.97);border:1px solid #E7E0D2;border-radius:18px;padding:24px;box-shadow:0 18px 44px rgba(0,0,0,.35);animation:in .35s cubic-bezier(.22,1,.36,1)}
  @keyframes in{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .qcard .q{font-size:17px;font-weight:700;line-height:1.7;margin-bottom:16px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#F8F4EA;border:1.5px solid #E7E0D2;border-radius:14px;padding:13px 16px;font-size:14.5px;font-family:inherit;color:var(--ink);cursor:pointer;margin-bottom:10px;transition:all .15s ease}
  .opt:hover{border-color:var(--navy);background:#EFF3FB;transform:translateX(3px)}
  .opt .k{width:26px;height:26px;flex:none;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}

  /* 结果 */
  .result{display:none}
  .rcard{border-radius:20px;overflow:hidden;box-shadow:0 16px 44px rgba(31,56,100,.18);border:1px solid #E7E0D2;animation:rise .45s cubic-bezier(.22,1,.36,1)}
  @keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  .rcard .top{padding:22px 22px 20px;text-align:center;color:#fff}
  .rcard .mascot{width:86px;height:86px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 10px;border:3px solid rgba(255,255,255,.9);box-shadow:0 10px 26px rgba(0,0,0,.35)}
  .rcard .top .eyebrow{font-size:12.5px;letter-spacing:.3em;opacity:.85}
  .rcard .top h3{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:900;margin:10px 0 2px;letter-spacing:.06em}
  .rcard .top .en{font-size:13px;letter-spacing:.22em;opacity:.9}
  .rcard .body{background:#fff;padding:18px 22px 22px}
  .rcard .desc{font-size:14px;line-height:1.9;color:var(--ink)}
  .rcard .tag{margin-top:12px;font-size:13px;color:#6E5B36;background:#F1E9DB;border-radius:10px;padding:9px 12px;line-height:1.7}
  .bars{margin-top:18px}
  .bars .bl{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
  .bars .bl .n{width:44px;color:var(--muted);flex:none}
  .bars .bl .track{flex:1;height:9px;background:#EDE6D6;border-radius:99px;overflow:hidden}
  .bars .bl .track i{display:block;height:100%;border-radius:99px;width:0;transition:width .8s cubic-bezier(.22,1,.36,1)}
  .bars .bl .v{width:26px;text-align:right;color:var(--muted);flex:none;font-weight:600}
  .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .acts .btn{flex:1;min-width:150px;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:13px 10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:.04em}
  .acts .btn:hover{background:var(--navy-deep)}
  .acts .btn.red{background:var(--red)}
  .acts .btn.red:hover{background:#A90D28}
  .acts .btn.gold{background:linear-gradient(180deg,#E8B84B,#D9A13B);color:#3A2A05;box-shadow:0 8px 20px rgba(232,184,75,.3)}
  .acts .btn.gold:hover{background:linear-gradient(180deg,#F2C95C,#E0AB3F)}
  .acts .btn.ghost{background:#fff;color:var(--navy);border:1px solid #D8D0BE}
  .disc{font-size:12px;color:#C3CFE6;text-align:center;margin-top:14px}

  /* 海报结果主体（博饼分享卡式整卡） */
  .posterbox{display:none;text-align:center;padding-top:6px}
  .posterbox img{max-width:430px;width:94%;border-radius:18px;box-shadow:0 16px 44px rgba(31,56,100,.28);display:block;margin:0 auto}
  .posterbox .ph{font-size:12.5px;color:#C3CFE6;margin-top:10px}

  /* 全屏海报弹窗（手机 H5 卡片式，参照博饼活动） */
  .modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;display:none;align-items:center;justify-content:center;background:rgba(5,8,22,.78);backdrop-filter:blur(6px);padding:20px}
  .modal.show{display:flex}
  .modal-box{background:linear-gradient(175deg,#1d2a52,#182248);border:1px solid rgba(232,184,75,.35);border-radius:20px;padding:18px 18px 14px;max-width:420px;width:100%;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5);text-align:center}
  .modal-box h3{font-family:"Noto Serif SC",serif;font-size:18px;color:var(--gold);letter-spacing:2px;margin-bottom:10px;flex-shrink:0}
  #posterModal .modal-box img{flex:0 1 auto;max-width:100%;max-height:calc(94vh - 250px);width:auto;align-self:center;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .modal-tip{font-size:13px;color:#ffd76a;background:linear-gradient(90deg,rgba(200,16,46,.2),rgba(200,16,46,.34));border:1px solid rgba(232,184,75,.45);border-radius:10px;padding:8px 10px;margin:12px 0;text-align:center;letter-spacing:1px;line-height:1.5;font-weight:600;flex-shrink:0}
  .modal-actions{display:flex;gap:10px;flex-shrink:0}
  .modal-actions .save-btn{flex:1;padding:13px 6px;font-size:15px;font-weight:700;font-family:inherit;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(180deg,#E8B84B,#D9A13B);color:#3A2A05;box-shadow:0 8px 20px rgba(232,184,75,.3);letter-spacing:.1em}
  .modal-actions .save-btn:active{transform:translateY(1px)}
  .modal-close{margin-top:12px;background:none;border:none;color:#9FB0CE;font-size:13px;cursor:pointer;letter-spacing:2px;font-family:inherit;padding:6px 16px;flex-shrink:0}
  .modal-close:hover{color:#fff}

  let idx=0,selectedFaculty=null,dimScore={W:0,S:0,C:0,L:0};
  const $=id=>document.getElementById(id);

  function reset(){idx=0;dimScore={W:0,S:0,C:0,L:0};buildDots();showQ()}

  function buildDots(){
    $("dots").innerHTML="";
    QUESTIONS.forEach((_,i)=>{const d=document.createElement("i");if(i===idx)d.classList.add("on");$("dots").appendChild(d)});
  }
  function refreshDots(){[...$("dots").children].forEach((d,i)=>d.classList.toggle("on",i===idx))}

  function showQ(){
    const q=QUESTIONS[idx];
    $("qText").textContent="Q"+(idx+1)+"  "+q.q;
    $("opts").innerHTML="";
    q.opts.forEach((o,i)=>{
      const b=document.createElement("button");
      b.className="opt";
      b.innerHTML=`<span class="k">${"ABCD"[i]}</span><span>${o.t}</span>`;
      b.addEventListener("click",()=>pick(o.d,b));
      $("opts").appendChild(b);
    });
    refreshDots();
  }

  function pick(d,b){
    const all=[...document.querySelectorAll(".opt")];
    all.forEach(x=>x.disabled=true);
    dimScore[d]+=1;
    b.style.borderColor=DIMS[d].color;
    b.style.background="#F0F6F2";
    setTimeout(()=>{
      idx++;
      if(idx<QUESTIONS.length)showQ();
      else showResult();
    },260);
  }

  function buildSel(){
    const box=$("selList");box.innerHTML="";
    Object.entries(FACULTIES).forEach(([k,f])=>{
      const b=document.createElement("button");
      b.className="opt";
      b.innerHTML=`<span class="k" style="background:${f.color}">${f.zh.slice(0,1)}</span><span>${f.zh}</span>`;
      b.addEventListener("click",()=>{
        selectedFaculty=k;
        $("selectView").style.display="none";
        $("quiz").style.display="block";
        reset();
      });
      box.appendChild(b);
    });
  }

  function showResult(){
    $("quiz").style.display="none";
    $("result").style.display="block";
    const dim=Object.entries(dimScore).sort((a,b)=>b[1]-a[1])[0][0];
    const P=PERSONA[selectedFaculty][dim],F=FACULTIES[selectedFaculty];
    $("resultHead").innerHTML=`<div style="font-size:12px;color:#E8B84B;letter-spacing:.14em;font-weight:600">${F.zh} · 你的学院人设</div><div style="font-family:'Noto Serif SC',serif;font-size:26px;font-weight:900;color:#fff;margin-top:8px">「${P.name}」</div><div style="font-size:13px;color:#C3CFE6;margin-top:6px">${P.tag}</div>`;
    setTimeout(()=>{document.querySelector(".result").scrollIntoView({behavior:"smooth",block:"center"})},120);
    showPoster();
  }

  $("startBtn").addEventListener("click",()=>{$("intro").style.display="none";buildSel();$("selectView").style.display="block"});
  $("againBtn").addEventListener("click",()=>{closePoster();$("result").style.display="none";buildSel();$("selectView").style.display="block"});

  let posterData = "";
  function wrapCv(x, str, maxW){
    const chars=[...str];let line="",lines=[];
    chars.forEach(ch=>{if(x.measureText(line+ch).width>maxW){lines.push(line);line=ch}else line+=ch});
    if(line)lines.push(line);
    return lines;
  }
  function makeQR(text,size){
    return new Promise(res=>{
      try{
        if(typeof QRCode==="undefined"){res(null);return}
        const box=document.createElement("div");
        box.style.cssText="position:absolute;left:-9999px;top:0";
        new QRCode(box,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});
        let tries=0;
        const tick=()=>{
          let cv=null;
          try{cv=box.querySelector("canvas")}catch(e){}
          if(cv&&cv.width>0&&cv.height>0){res(cv);return}
          if(++tries>25){res(null);return}
          setTimeout(tick,80);
        };
        tick();
      }catch(e){res(null)}
    });
  }
  function loadImg(src){
    return new Promise(res=>{
      let done=false;
      const finish=v=>{if(!done){done=true;res(v)}};
      const im=new Image();
      im.onload=()=>finish(im);
      im.onerror=()=>finish(null);
      im.src=src;
      setTimeout(()=>finish(im.complete&&im.naturalWidth>0?im:null),1500);
    });
  }
  function drawPoster(cb){posterDraw(720,cb)}
  function posterDraw(W,cb){
    const H=Math.round(W*1280/720),S=W/720;
    const top=selectedFaculty||"arts";
    const F=FACULTIES[top];
    const dim=Object.entries(dimScore).sort((a,b)=>b[1]-a[1])[0][0];
    const P=PERSONA[top][dim];
    let c=null,x=null;
    try{c=document.createElement("canvas");c.width=W;c.height=H;x=c.getContext("2d")}catch(e){}
    if(!c||!x){if(W>640){posterDraw(Math.round(W*2/3),cb);return}cb("");return}
    const down=()=>{if(W>640){posterDraw(Math.round(W*2/3),cb);return}cb("")};
    try{
      x.scale(S,S);
      x.textAlign="center";
      // 左栏背景（人格海报）
      x.fillStyle="#16294A";x.fillRect(0,0,720,1280);
      const g=x.createRadialGradient(360,330,60,360,330,540);
      g.addColorStop(0,F.color+"33");g.addColorStop(1,"rgba(22,41,74,0)");
      x.fillStyle=g;x.fillRect(0,0,720,1280);
      x.fillStyle="rgba(232,184,75,.10)";x.beginPath();x.arc(625,160,230,0,Math.PI*2);x.fill();
      x.fillStyle="rgba(200,16,46,.14)";x.beginPath();x.arc(105,1145,250,0,Math.PI*2);x.fill();
      // 左栏金框
      x.strokeStyle="#E8B84B";x.lineWidth=4;x.strokeRect(28,28,664,1224);
      x.strokeStyle="rgba(232,184,75,.45)";x.lineWidth=1;x.strokeRect(40,40,640,1200);
      // 左栏头部
      x.fillStyle="#E8B84B";x.font="600 19px 'Noto Serif SC',serif";
      x.fillText("UNIVERSITY OF SYDNEY · EST. 1850",360,80);
      x.fillStyle="#fff";x.font="900 34px 'Noto Serif SC',serif";
      x.fillText("悉大 176 周年 · 学院人设测试",360,120);
      x.fillStyle="#9FB0CE";x.font="500 14px 'Noto Sans SC',sans-serif";
      x.fillText("SIDERE MENS EADEM MUTATO · 繁星纵变，智慧永恒",360,146);
      x.strokeStyle="rgba(232,184,75,.6)";x.lineWidth=1;x.beginPath();x.moveTo(190,166);x.lineTo(530,166);x.stroke();
    }catch(e){down();return}
    const finish=()=>{
      try{posterData=c.toDataURL("image/png")}catch(e){posterData=""}
      if(posterData){cb(posterData);return}
      down();
    };
    Promise.all([loadImg(MASCOAT[top]||"assets/faculty/"+top+".png"),loadImg(QR_IMG)]).then(v=>{
      try{
        const mascot=v[0],qr=v[1];
        x.save();
        x.beginPath();x.arc(360,330,118,0,Math.PI*2);x.clip();
        if(mascot){
          x.fillStyle="#16294A";x.fillRect(242,212,236,236);
          x.drawImage(mascot,242,212,236,236);
        }else{
          x.fillStyle=F.color;x.fillRect(242,212,236,236);
          x.fillStyle="#fff";x.font="900 42px 'Noto Serif SC',serif";x.fillText(F.zh,360,368);
        }
        x.restore();
        x.strokeStyle="#E8B84B";x.lineWidth=5;x.beginPath();x.arc(360,330,118,0,Math.PI*2);x.stroke();
        // 学院名
        x.fillStyle="#fff";x.font="900 30px 'Noto Serif SC',serif";
        x.fillText(F.zh,360,512);
        x.fillStyle="#E8B84B";x.font="700 17px 'Noto Sans SC',sans-serif";
        x.fillText(F.en,360,544);
        // 人格名 + tag
        x.fillStyle="#E8B84B";x.font="900 34px 'Noto Serif SC',serif";
        x.fillText("「"+P.name+"」",360,588);
        x.fillStyle="#EDE4D3";x.font="500 20px 'Noto Sans SC',sans-serif";
        wrapCv(x,P.tag,500).forEach((ln,i)=>x.fillText(ln,360,628+i*30));
        // 四维人设条
        x.font="500 19px 'Noto Sans SC',sans-serif";
        let by=700;
        Object.entries(DIMS).forEach(([k,d])=>{
          x.fillStyle="#C3CFE6";x.fillText(d.zh,150,by+20);
          x.fillStyle="rgba(255,255,255,.14)";x.fillRect(285,by+5,300,16);
          x.fillStyle=d.color;x.fillRect(285,by+5,Math.max(10,(dimScore[k]/8)*300),16);
          x.fillStyle="#fff";x.font="700 17px 'Noto Sans SC',sans-serif";
          x.fillText(String(dimScore[k]),600,by+20);
          x.font="500 19px 'Noto Sans SC',sans-serif";
          by+=46;
        });
        // 二维码区
        x.fillStyle="#fff";x.font="700 26px 'Noto Sans SC',sans-serif";
        x.fillText("扫码添加狮子头获取测试链接",360,910);
        x.fillText("看看你是学院里哪种人设",360,942);
        x.fillStyle="#9FB0CE";x.font="400 15px 'Noto Sans SC',sans-serif";
        if(qr){x.drawImage(qr,275,984,170,170)}
        else{
          x.strokeStyle="#9FB0CE";x.lineWidth=2;x.strokeRect(275,984,170,170);
          x.fillStyle="#9FB0CE";x.font="500 15px 'Noto Sans SC',sans-serif";x.fillText("二维码生成失败",360,1069);
        }
        x.fillStyle="#A9B8D4";x.font="400 13px 'Noto Serif SC',serif";
        x.fillText("庆祝悉尼大学建校176周年 · 测试仅供娱乐",360,1206);
      }catch(e){}
      finish();
    }).catch(()=>{finish()});
  }

      <div id="domQr" style="width:120px;height:120px;margin:10px auto 0;background:#fff;border-radius:10px;padding:5px;box-sizing:border-box"></div>
      <div style="font-size:11px;color:#C3CFE6;margin-top:10px">扫码添加小助手 · 参与校庆抽奖</div>
      <div style="font-size:10px;color:#A9B8D4;margin-top:8px">庆祝悉尼大学建校176周年 · 测试仅供娱乐</div>
    `;
    {const qbox=card.querySelector("#domQr");
      if(qbox){const im=new Image();im.onload=()=>{im.style.cssText="width:100%;height:100%;object-fit:contain;display:block";qbox.appendChild(im)};im.src=QR_IMG}}
    return card;
  }
  function ensurePosterShown(){
    $("posterBox").style.display="block";
    if(posterData){openPoster();return}
    let dom=$("domPoster");
    if(!dom){
      dom=buildDomPoster();
      dom.id="domPoster";
      $("posterBox").insertBefore(dom,$("posterImg"));
    }
    $("posterImg").style.display="none";
    const mbox=document.querySelector("#posterModal .modal-box");
    let mdom=$("modalDomPoster");
    if(!mdom){
      mdom=buildDomPoster();
      mdom.id="modalDomPoster";
      mdom.style.maxWidth="360px";
      mdom.style.margin="0 auto 10px";
      mbox.insertBefore(mdom,mbox.querySelector("h3").nextSibling);
    }
    $("modalImg").style.display="none";
    $("posterModal").classList.add("show");
  }
  function showPoster(){
    let done=false;
    const fb=setTimeout(()=>{   // 兜底：3.5 秒仍未完成则强制展示结果
      if(done)return;
      done=true;
      ensurePosterShown();
    },3500);
    drawPoster(data=>{
      if(done)return;
      done=true;
      clearTimeout(fb);
      if(data){
        $("posterImg").src=data;
        $("posterImg").style.display="block";
      }
      $("posterBox").style.display="block";
      openPoster();
    });
  }
  function openPoster(){
    if(!posterData){ensurePosterShown();return}
    $("modalImg").style.display="block";
    const mdom=$("modalDomPoster");
    if(mdom)mdom.style.display="none";
    $("modalImg").src=posterData;
    $("posterModal").classList.add("show");
  }
  function closePoster(){$("posterModal").classList.remove("show")}
  let toastTimer=null;
  function showToast(msg){
    const t=$("toast");
    t.textContent=msg;
    t.style.display="block";
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.style.display="none",2200);
  }
  $("saveBtn").addEventListener("click",openPoster);
  $("modalSaveBtn").addEventListener("click",()=>showToast("长按海报图片即可保存到相册"));
  $("modalClose").addEventListener("click",closePoster);
  $("posterModal").addEventListener("click",e=>{if(e.target===$("posterModal"))closePoster()});
</script>
</body>
</html>
